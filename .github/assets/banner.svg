<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="white" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="300" stroke="white" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="300" stroke="white" stroke-width="1"/>
  </g>

  <!-- Stitch icon (left) -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="90" height="90" rx="16" fill="url(#accent)" opacity="0.15"/>
    <rect x="10" y="10" width="70" height="70" rx="12" fill="url(#accent)" opacity="0.3"/>
    <rect x="20" y="20" width="50" height="50" rx="8" fill="url(#accent)"/>
    <text x="45" y="52" font-family="system-ui" font-size="24" fill="white" text-anchor="middle" font-weight="bold">S</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(210, 135)">
    <line x1="0" y1="15" x2="60" y2="15" stroke="#6366F1" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="60,5 80,15 60,25" fill="#6366F1"/>
  </g>

  <!-- Next.js icon (right of arrow) -->
  <g transform="translate(310, 100)">
    <rect x="0" y="0" width="90" height="90" rx="16" fill="white" opacity="0.1"/>
    <rect x="10" y="10" width="70" height="70" rx="12" fill="white" opacity="0.15"/>
    <circle cx="45" cy="45" r="25" fill="white" opacity="0.9"/>
    <text x="45" y="53" font-family="system-ui" font-size="22" fill="#0F172A" text-anchor="middle" font-weight="bold">N</text>
  </g>

  <!-- Title -->
  <text x="460" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="42" fill="white" font-weight="bold">
    stitch-to-nextjs
  </text>

  <!-- Subtitle -->
  <text x="460" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94A3B8">
    Pixel-perfect Stitch designs to Next.js components
  </text>

  <!-- Tags -->
  <g transform="translate(460, 195)">
    <rect x="0" y="0" width="110" height="28" rx="14" fill="#6366F1" opacity="0.2"/>
    <text x="55" y="19" font-family="system-ui" font-size="12" fill="#A5B4FC" text-anchor="middle">Claude Code Skill</text>

    <rect x="120" y="0" width="85" height="28" rx="14" fill="#22C55E" opacity="0.2"/>
    <text x="162" y="19" font-family="system-ui" font-size="12" fill="#86EFAC" text-anchor="middle">Tailwind CSS</text>

    <rect x="215" y="0" width="80" height="28" rx="14" fill="#F97316" opacity="0.2"/>
    <text x="255" y="19" font-family="system-ui" font-size="12" fill="#FDBA74" text-anchor="middle">29 Fonts</text>

    <rect x="305" y="0" width="90" height="28" rx="14" fill="#EC4899" opacity="0.2"/>
    <text x="350" y="19" font-family="system-ui" font-size="12" fill="#F9A8D4" text-anchor="middle">Zero Drift</text>
  </g>
</svg>
